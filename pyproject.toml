[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imputation-benchmark"
version = "0.1.0"
description = "Missing Value Imputation Benchmark Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "wandb>=0.15",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dl = [
    "torch>=2.0",
]
ml = [
    "xgboost>=1.7",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "pre-commit>=3.4",
]
all = [
    "imputation-benchmark[dl,ml,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
