project:
  name: missing-value-imputation-benchmark
  task_name: benchmark_core
  seed: 42
  output_dir: results/

runtime:
  device: cpu
  num_workers: 4
  deterministic: true

tracking:
  use_wandb: false
  project: missing-value-imputation-benchmark
  entity: null
  group: null
  tags: [benchmark]
  log_artifacts: true
  output_dir: results/logs

experiment:
  repeat_seeds: [42, 123, 456, 789, 1024]
  save_imputed_data: false
  save_masks: true

dataset:
  split:
    train_ratio: 0.8
    valid_ratio: 0.0
    test_ratio: 0.2
    stratify: true

downstream:
  enabled: true
  model: random_forest
  params:
    n_estimators: 100
    random_state: 42
