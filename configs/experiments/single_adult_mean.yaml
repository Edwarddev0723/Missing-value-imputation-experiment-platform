# Single experiment: Adult + MCAR 10% + Mean imputation
# Usage: python scripts/run_experiment.py --config configs/experiments/single_adult_mean.yaml

project:
  name: missing-value-imputation-benchmark
  seed: 42
  output_dir: results/

dataset:
  name: adult
  split:
    train_ratio: 0.7
    valid_ratio: 0.1

missingness:
  mechanism: MCAR
  rate: 0.1
  seed: 123
  scenario_tag: benchmark_mcar
  exclude_target: true

method:
  name: mean
  params: {}

tracking:
  use_wandb: false
  output_dir: results/logs

downstream:
  enabled: true
  params:
    n_estimators: 100
    max_depth: 5
